<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Wireframes — Page Parcours</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="wireframes/sketch.css" />
<style>
  html, body { margin: 0; padding: 0; background: #0a0808; height: 100%; font-family: 'Kalam', cursive; color: #d8cba8; }
  .dc-root { background: radial-gradient(ellipse at top, #1a1410 0%, #0a0807 70%) !important; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wireframes/parcours-data.jsx"></script>
<script type="text/babel" src="wireframes/pwf1.jsx"></script>
<script type="text/babel" src="wireframes/pwf2.jsx"></script>
<script type="text/babel" src="wireframes/pwf3.jsx"></script>
<script type="text/babel" src="wireframes/pwf4.jsx"></script>
<script type="text/babel" src="wireframes/pwf5.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { DesignCanvas, DCSection, DCArtboard } = window;
const W = 1200;
const H = 900;

function App() {
  return (
    <DesignCanvas
      title="Page Parcours — 5 wireframes"
      subtitle="Expériences (timeline) + Formation (unique) + Certifications (12). Lo-fi parchemin gothique. Glisser pour réorganiser, cliquer pour zoomer."
    >
      <DCSection id="parcours" title="Cinq structures à comparer" subtitle="Les annotations rouges expliquent l'intention de chaque variante.">
        <DCArtboard id="pwf1" label="① Triptyque · 3 colonnes" width={W} height={H}>
          <window.PWF1Triptyque />
        </DCArtboard>
        <DCArtboard id="pwf2" label="② Spine · timeline + rail" width={W} height={H}>
          <window.PWF2Spine />
        </DCArtboard>
        <DCArtboard id="pwf3" label="③ Codex · onglets" width={W} height={H}>
          <window.PWF3Codex />
        </DCArtboard>
        <DCArtboard id="pwf4" label="④ Strates · empilées" width={W} height={H}>
          <window.PWF4Strates />
        </DCArtboard>
        <DCArtboard id="pwf5" label="⑤ Manuscrit · double-page" width={W} height={H}>
          <window.PWF5Manuscrit />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
