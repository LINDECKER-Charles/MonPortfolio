# Serveur d'images de DEV (miroir local du vhost images.<domaine>).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Le front tourne sur une autre origine (localhost:DEV_PORT).
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ =404;
        autoindex on;
    }
}
