<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="10" />
    <title>Le rêve se reconstruit…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at center, #17130f 0%, #0d0b09 70%);
        color: #d6c9a8;
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
      }
      .rune {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.5rem;
        opacity: 0.75;
      }
      h1 {
        font-size: 1.4rem;
        font-weight: normal;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #c9b78c;
      }
      p {
        color: #8f8570;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="rune" viewBox="0 0 80 80" fill="none" aria-hidden="true">
        <circle cx="40" cy="40" r="32" stroke="#a49476" stroke-width="1" opacity="0.6" />
        <circle cx="40" cy="40" r="22" stroke="#a49476" stroke-width="0.6" opacity="0.4" />
        <path d="M40 12 L40 68 M12 40 L68 40" stroke="#a49476" stroke-width="0.6" opacity="0.35" />
        <circle cx="40" cy="40" r="3" fill="#a49476" opacity="0.8" />
      </svg>
      <h1>Le rêve se reconstruit</h1>
      <p>Une mise à jour est en cours — la page se rechargera d'elle-même dans quelques instants.</p>
    </main>
  </body>
