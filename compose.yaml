# Environnement de DEV dockerisé — uniquement le dev (la prod reste CI → VPS).
#
#   docker compose up            → front sur http://localhost:${DEV_PORT}
#                                  images sur http://localhost:${IMAGE_SERVER_PORT}
#
# Configuration : .env racine (cf. .env.example). Sans .env, les défauts
# ci-dessous s'appliquent — le front dev consomme alors le serveur d'images
# LOCAL (nginx servant ./images) au lieu du vhost distant.
name: monportfolio

services:
  front:
    build:
      context: ./front-portfolio
      dockerfile: Dockerfile.dev
    ports:
      - "${DEV_PORT:-4200}:4200"
    environment:
      # Injecté au prestart par scripts/gen-env.mjs (priorité à process.env).
      IMAGE_SERVER_URL: ${IMAGE_SERVER_URL:-http://localhost:8081}
      SITE_URL: ${SITE_URL:-https://charles-lindecker.com}
    volumes:
      - ./front-portfolio:/app
      # node_modules du conteneur isolés du host (binaires linux ≠ windows).
      - front_node_modules:/app/node_modules
    depends_on:
      - images

  # Serveur d'images local : miroir dev du vhost images.<domaine>.
  images:
    image: nginx:1.27-alpine
    ports:
      - "${IMAGE_SERVER_PORT:-8081}:80"
    volumes:
      - ./images:/usr/share/nginx/html:ro
      - ./docker/nginx-images.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  front_node_modules:
