name: monportfolio

# Stack de PRODUCTION — un seul service : le serveur SSR Angular (Express) qui sert
# aussi les images statiques (images/ embarquées dans l'image, exposées sous /img).
#
# Les commodités de DEV (dev-server Angular, nginx images local) vivent dans
# compose.override.yaml, auto-mergé en local et JAMAIS appliqué sur un hôte servi :
# les jobs de déploiement sélectionnent explicitement
#   COMPOSE_FILE=compose.yaml:compose.deploy.yaml   (cf. .github/workflows/_deploy.yml)
#
# Substitution des variables : .env racine (copie de .env.example en dev ; écrit par
# la pipeline depuis le secret ENV_STAGING / ENV_PROD sur les hôtes servis).

services:
  front:
    image: ${REGISTRY:-monportfolio}/front:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/front/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      # Hosts admis par la garde SSRF d'@angular/ssr, en complément d'angular.json :
      # staging sert le bundle prod sous son propre domaine sans rebuild.
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:-}
      # 1 → X-Robots-Tag "noindex, nofollow" sur toutes les réponses (environnement de test).
      ROBOTS_NOINDEX: ${ROBOTS_NOINDEX:-0}
    # Aucun port publié : l'entrée publique est l'edge proxy partagé (compose.deploy.yaml) ;
    # le dev publie ${DEV_PORT} via compose.override.yaml.
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
