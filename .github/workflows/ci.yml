name: CI - Angular

# Workflow réutilisable : lint + format + tests + build + e2e, puis publie
# l'artefact `angular-dist` consommé par deploy-ssr.yml.
# Appelé par ci-cd-test.yml (push dev) et ci-cd-prod.yml (push main).
on:
  workflow_call:
    inputs:
      upload-coverage:
        description: "Publier le rapport de coverage en artefact"
        type: boolean
        default: false

env:
  FRONT_DIR: front-portfolio

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            ${{ env.FRONT_DIR }}
            .github
          sparse-checkout-cone-mode: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ env.FRONT_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONT_DIR }}
        run: npm ci

      - name: Audit production dependencies
        working-directory: ${{ env.FRONT_DIR }}
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (ESLint + Stylelint)
        working-directory: ${{ env.FRONT_DIR }}
        run: npm run lint

      - name: Check formatting (Prettier)
        working-directory: ${{ env.FRONT_DIR }}
        run: npm run format:check

      # shell: bash => pipefail : l'échec de ng test fait échouer le step malgré le tee
      - name: Run unit tests + coverage
        working-directory: ${{ env.FRONT_DIR }}
        shell: bash
        run: npx ng test --no-watch --code-coverage --browsers=ChromeHeadless 2>&1 | tee karma.log

      - name: Publish test & coverage summary
        if: always()
        working-directory: ${{ env.FRONT_DIR }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/test-summary.mjs" karma.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && inputs.upload-coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ${{ env.FRONT_DIR }}/coverage
          if-no-files-found: ignore

      - name: Build Angular app
        working-directory: ${{ env.FRONT_DIR }}
        run: npm run build

      # Traçabilité du build servi : vérifié après déploiement (deploy-ssr.yml)
      # contre l'origine publique — détecte les câblages croisés test/prod.
      - name: Stamp build-info
        working-directory: ${{ env.FRONT_DIR }}
        shell: bash
        run: |
          cat > dist/front-portfolio/browser/build-info.json <<EOF
          {
            "runId": "${{ github.run_id }}",
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref_name }}",
            "builtAt": "$(date -u +%FT%TZ)"
          }
          EOF

      - name: Install Playwright browsers
        working-directory: ${{ env.FRONT_DIR }}
        run: npx playwright install --with-deps chromium

      # Serveur d'images stubbé dans les specs (e2e/image-server-stub.ts) :
      # toutes les routes sont couvertes, y compris / et /linktree.
      - name: Run e2e + a11y tests (Playwright)
        working-directory: ${{ env.FRONT_DIR }}
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ${{ env.FRONT_DIR }}/playwright-report
          if-no-files-found: ignore

      - name: Upload Angular dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: angular-dist
          path: ${{ env.FRONT_DIR }}/dist
          if-no-files-found: error
