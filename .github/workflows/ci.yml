name: CI/CD

# Orchestrator only — wiring + branch guards. All real work lives in reusable
# workflows (_tests, _build, _deploy, _promote), each with a single responsibility.
# No sensitive value here: hosts, paths, domains and app secrets are passed as
# repository secrets / live inside the per-host ENV_FILE.
#
# Two-stage promotion (build once, promote the same artifact):
#   push dev  ─▶ _tests ─▶ merge dev→test ─▶ _build (:sha + :staging) ─▶ _deploy STAGING
#   push main ─▶ _promote (:staging → :prod) ─▶ _deploy PROD
#
# `test` never triggers this workflow. `main` is reached only by a manual test→main
# merge — that human gate promotes to production (prod never rebuilds).
on:
  push:
    branches: [dev, main]
  # PRs into dev (Dependabot included) only run the test suite: downstream jobs are
  # guarded on refs/heads/dev, and a pull_request ref is refs/pull/<n>/merge.
  pull_request:
    branches: [dev]

# Un run à la fois par branche : deux pushes rapprochés sur dev ne se disputent ni le
# push vers `test` ni l'hôte de déploiement. Jamais d'annulation (déploiement en cours).
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

# Moindre privilège : chaque job déclare exactement ce qu'il consomme (un job appelant
# doit posséder au moins les permissions du workflow réutilisable qu'il invoque).
permissions: {}

jobs:
  # ───────────────────────────────── dev path ────────────────────────────────
  tests:
    if: github.ref == 'refs/heads/dev' || github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/_tests.yml

  merge-to-test:
    needs: tests
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pousse la branche test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge dev → test (create from main if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --all --prune
          if git show-ref --verify --quiet refs/remotes/origin/test; then
            git checkout -B test origin/test
          else
            git checkout -B test origin/main
          fi
          git merge --no-ff --no-edit "${GITHUB_SHA}"
          git push origin HEAD:test

  build:
    needs: merge-to-test
    if: github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write   # push GHCR
    uses: ./.github/workflows/_build.yml
    with:
      ref: test
      moving_tag: staging

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    uses: ./.github/workflows/_deploy.yml
    with:
      branch: test
    secrets:
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      SSH_HOST: ${{ secrets.STAGING_HOST }}
      DEPLOY_PATH: ${{ secrets.STAGING_PATH }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      ENV_FILE: ${{ secrets.ENV_STAGING }}
      ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
      REPO_URL: ${{ secrets.REPO_URL }}

  # ──────────────────────────────── main path ────────────────────────────────
  promote:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write   # retag GHCR
    uses: ./.github/workflows/_promote.yml
    with:
      source_tag: staging
      target_tags: prod latest

  deploy-prod:
    needs: promote
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/_deploy.yml
    with:
      branch: main
    secrets:
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      SSH_HOST: ${{ secrets.PROD_HOST }}
      DEPLOY_PATH: ${{ secrets.PROD_PATH }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      ENV_FILE: ${{ secrets.ENV_PROD }}
      ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
      REPO_URL: ${{ secrets.REPO_URL }}
