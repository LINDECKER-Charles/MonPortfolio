name: CI/CD - Test - Angular

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  # Un nouveau push annule le CI en cours (résultat obsolète)…
  ci:
    concurrency:
      group: ci-test-angular
      cancel-in-progress: true
    uses: ./.github/workflows/ci.yml
    with:
      upload-coverage: true

  merge-test:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge dev into test
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git fetch origin dev test
          git checkout test
          git merge origin/dev --no-ff -m "CI: merge dev into test"
          git push origin test

  push-images-test:
    needs: ci
    runs-on: ubuntu-latest

    env:
      IMAGES_PATH: images

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            ${{ env.IMAGES_PATH }}
          sparse-checkout-cone-mode: true

      # ⚠️ Docroot PARTAGÉ test/prod (images.<domaine>) : un renommage/suppression
      # ici impacte la prod immédiatement (--delete). Cf. images/README.md.
      - name: Sync images to VPS
        uses: burnett01/rsync-deployments@9.0.0
        continue-on-error: true
        with:
          switches: -av --delete
          path: ${{ env.IMAGES_PATH }}/
          remote_path: ${{ secrets.APACHE_IMAGES_DOCROOT }}
          remote_host: ${{ secrets.VPS_IP }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

  # …mais un déploiement commencé n'est JAMAIS annulé (bascule atomique en cours).
  deploy-test:
    needs: ci
    concurrency:
      group: deploy-test-angular
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-ssr.yml
    with:
      vps-dir: /var/www/portfolio-test
      service: angular-portfolio-test.service
    secrets:
      VPS_IP: ${{ secrets.VPS_IP }}
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSR_PORT: ${{ secrets.APACHE_TEST_SSR_PORT }}
      DOMAIN: ${{ secrets.APACHE_TEST_DOMAIN }}

  apply-apache-config:
    needs: deploy-test
    uses: ./.github/workflows/deploy-apache.yml
    with:
      sites: "portfolio-test portfolio-test-le-ssl portfolio-images portfolio-images-le-ssl"
    secrets: inherit
