name: CI/CD - Test - Angular

on:
  push:
    branches:
      - dev

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FRONT_DIR: front-portfolio
  VPS_DIR: /var/www/portfolio-test
  FRONT_PROCESS: angular-portfolio-test.service
  IMAGES_PATH: images
  IMAGES_VPS: /var/www/charles-lindecker-img

concurrency:
  group: deploy-test-angular
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            ${{ env.FRONT_DIR }}
            .github
          sparse-checkout-cone-mode: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.FRONT_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONT_DIR }}
        run: npm ci

      - name: Run linter
        working-directory: ${{ env.FRONT_DIR }}
        run: npm run lint --if-present

      # shell: bash => pipefail : l'échec de ng test fait échouer le step malgré le tee
      - name: Run unit tests + coverage
        working-directory: ${{ env.FRONT_DIR }}
        shell: bash
        run: npx ng test --no-watch --code-coverage --browsers=ChromeHeadless 2>&1 | tee karma.log

      - name: Publish test & coverage summary
        if: always()
        working-directory: ${{ env.FRONT_DIR }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/test-summary.mjs" karma.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: ${{ env.FRONT_DIR }}/coverage
          if-no-files-found: ignore

      - name: Build Angular app
        working-directory: ${{ env.FRONT_DIR }}
        run: npm run build

      - name: Install Playwright browsers
        working-directory: ${{ env.FRONT_DIR }}
        run: npx playwright install --with-deps chromium

      - name: Run e2e + a11y tests (Playwright)
        working-directory: ${{ env.FRONT_DIR }}
        env:
          # / et /linktree timeout sur les runners GitHub : leurs assets eager du
          # serveur d'images n'aboutissent pas et l'event `load` n'est jamais émis.
          # Couverture complète conservée en local (npm run e2e sans la variable).
          E2E_EXCLUDE_ROUTES: "/,/linktree"
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: ${{ env.FRONT_DIR }}/playwright-report
          if-no-files-found: ignore

      - name: Run Lighthouse CI
        working-directory: ${{ env.FRONT_DIR }}
        run: npm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: ${{ env.FRONT_DIR }}/.lighthouseci
          if-no-files-found: ignore

      - name: Upload Angular dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: angular-dist
          path: ${{ env.FRONT_DIR }}/dist
          if-no-files-found: error

  merge-test:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge dev into test
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git fetch origin dev test
          git checkout test
          git merge origin/dev --no-ff -m "CI: merge dev into test"
          git push origin test

  push-images-test:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            ${{ env.IMAGES_PATH }}
          sparse-checkout-cone-mode: true

      - name: Sync images to VPS
        uses: burnett01/rsync-deployments@8.0.4
        continue-on-error: true
        with:
          switches: -av --delete
          path: ${{ env.IMAGES_PATH }}/
          remote_path: ${{ env.IMAGES_VPS }}
          remote_host: ${{ secrets.VPS_IP }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy-test:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Download Angular dist artifact
        uses: actions/download-artifact@v7
        with:
          name: angular-dist
          path: ./dist

      - name: Ensure remote folders exist
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ env.VPS_DIR }}

      - name: Clean remote folder except persistent dirs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            find ${{ env.VPS_DIR }} -mindepth 1 -maxdepth 1 \
              ! -name uploads \
              ! -name logs-app \
              -exec rm -rf {} +

      - name: Copy Angular build to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: ${{ env.VPS_DIR }}

      - name: Restart Angular service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart ${{ env.FRONT_PROCESS }}
            sudo systemctl status ${{ env.FRONT_PROCESS }} --no-pager

  apply-apache-config:
    needs: deploy-test
    uses: ./.github/workflows/deploy-apache.yml
    with:
      sites: "portfolio-test portfolio-test-le-ssl portfolio-images portfolio-images-le-ssl"
    secrets: inherit

