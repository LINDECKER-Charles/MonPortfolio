name: Deploy - SSR release

# Workflow réutilisable : déploiement ATOMIQUE du build SSR par releases +
# symlink `current`, avec health-check et rollback automatique.
#
# Remplace l'ancien wipe-and-replace (rm -rf → scp → restart en 3 sessions SSH)
# qui laissait une fenêtre de ~10-15 s où le process Node servait un arbre
# supprimé (cf. docs/investigations/2026-08-21-freeze-prod-remise-en-prod.md).
#
# Arborescence attendue sur le VPS (cf. docs/deploiement.md pour la migration) :
#   $VPS_DIR/releases/<run_id>/dist/front-portfolio/...
#   $VPS_DIR/current -> releases/<run_id>          (symlink, bascule atomique)
#   $VPS_DIR/shared/{.env,uploads,logs-app}        (persistant, hors releases)
# Unit systemd : ExecStart sur $VPS_DIR/current/dist/front-portfolio/server/server.mjs
# + EnvironmentFile=$VPS_DIR/shared/.env (PORT, NODE_ENV, NG_ALLOWED_HOSTS…).
on:
  workflow_call:
    inputs:
      vps-dir:
        description: "Répertoire racine du site sur le VPS"
        required: true
        type: string
      service:
        description: "Unit systemd du serveur SSR"
        required: true
        type: string
      keep-releases:
        description: "Nombre de releases conservées (rollback + chunks N-1)"
        type: number
        default: 3
    secrets:
      VPS_IP:
        required: true
      VPS_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SSR_PORT:
        description: "Port d'écoute local du serveur SSR (health-check)"
        required: true
      DOMAIN:
        description: "Domaine public servi (vérification post-déploiement)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download Angular dist artifact
        uses: actions/download-artifact@v7
        with:
          name: angular-dist
          path: ./dist

      - name: Upload release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: ${{ inputs.vps-dir }}/releases/${{ github.run_id }}

      - name: Activate release (switch atomique + health-check + rollback)
        uses: appleboy/ssh-action@v1
        env:
          VPS_DIR: ${{ inputs.vps-dir }}
          SERVICE: ${{ inputs.service }}
          SSR_PORT: ${{ secrets.SSR_PORT }}
          RUN_ID: ${{ github.run_id }}
          KEEP: ${{ inputs.keep-releases }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: VPS_DIR,SERVICE,SSR_PORT,RUN_ID,KEEP
          script: |
            set -euo pipefail
            cd "$VPS_DIR"
            mkdir -p releases shared/uploads shared/logs-app

            NEW="$VPS_DIR/releases/$RUN_ID"
            test -f "$NEW/dist/front-portfolio/server/server.mjs" \
              || { echo "Release incomplète : $NEW"; exit 1; }

            # Chunks hashés de la release précédente recopiés (absents uniquement) :
            # les onglets ouverts avant le déploiement gardent des imports valides.
            PREV="$(readlink -f current 2>/dev/null || true)"
            if [ -n "$PREV" ] && [ -d "$PREV/dist/front-portfolio/browser" ]; then
              cp -an "$PREV"/dist/front-portfolio/browser/chunk-*.js   "$NEW/dist/front-portfolio/browser/" 2>/dev/null || true
              cp -an "$PREV"/dist/front-portfolio/browser/main-*.js    "$NEW/dist/front-portfolio/browser/" 2>/dev/null || true
              cp -an "$PREV"/dist/front-portfolio/browser/styles-*.css "$NEW/dist/front-portfolio/browser/" 2>/dev/null || true
            fi

            # Bascule atomique : le process en cours garde son arbre jusqu'au restart.
            ln -sfn "$NEW" current.tmp && mv -Tf current.tmp current
            sudo systemctl restart "$SERVICE"

            # Health-check : jamais de job vert si le service ne répond pas.
            ok=""
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$SSR_PORT/health" >/dev/null 2>&1; then ok=1; break; fi
              sleep 0.5
            done
            if [ -z "$ok" ]; then
              echo "Health-check KO sur 127.0.0.1:$SSR_PORT — rollback"
              if [ -n "$PREV" ]; then
                ln -sfn "$PREV" current.tmp && mv -Tf current.tmp current
                sudo systemctl restart "$SERVICE"
              fi
              exit 1
            fi

            # Purge : garder les KEEP dernières releases.
            ls -dt "$VPS_DIR"/releases/* | tail -n "+$((KEEP + 1))" | xargs -r rm -rf
            echo "Release $RUN_ID active."

      # Vérifie que l'origine PUBLIQUE sert bien ce run : détecte un câblage
      # croisé unit/port/vhost ou une copie manuelle (incidents 2026-06/2026-08).
      - name: Verify public origin serves this run
        shell: bash
        run: |
          set -euo pipefail
          origin="https://${{ secrets.DOMAIN }}"
          body="$(curl -fsS "$origin/build-info.json")"
          echo "$body"
          echo "$body" | grep -q "\"runId\": \"${{ github.run_id }}\"" \
            || { echo "::error::$origin ne sert pas ce run — câblage croisé ou copie manuelle (cf. docs/investigations)"; exit 1; }
          curl -fsS "$origin/" | grep -q 'ng-server-context="ssg' \
            || { echo "::error::$origin ne sert pas le prérendu SSG (fallback CSR ? vérifier allowedHosts/NG_ALLOWED_HOSTS)"; exit 1; }
