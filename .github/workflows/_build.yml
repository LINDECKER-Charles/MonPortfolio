name: _build

# Reusable: build the project image and push it to GHCR, tagged with the BUILT commit
# SHA (immutable) plus a moving tag (default: staging). Single responsibility = "produce
# the candidate artifact". Uses the automatic GITHUB_TOKEN (no extra secret needed).
#
# Une seule image : `front` (docker/front/Dockerfile, contexte = racine du repo —
# elle embarque images/). Le tag immuable et build-info.json portent le SHA du commit
# réellement construit (la tête de `ref`, = le commit de merge dev→test), pas celui du
# push déclencheur. Les build-args ne font que tracer ; la config build-time reste
# celle de production (build-once, cf. Dockerfile).
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build from (e.g. the test branch after merge).
        required: true
        type: string
      moving_tag:
        description: Moving tag applied alongside the immutable SHA tag (e.g. staging).
        required: false
        type: string
        default: staging

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Compute image prefix (lowercase owner) and built SHA
        run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/monportfolio" >> "$GITHUB_ENV"
          echo "BUILT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push front
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/front/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ env.BUILT_SHA }}
            GIT_REF=${{ inputs.ref }}
            BUILD_ID=${{ github.run_id }}
          tags: |
            ${{ env.IMG }}/front:${{ env.BUILT_SHA }}
            ${{ env.IMG }}/front:${{ inputs.moving_tag }}
