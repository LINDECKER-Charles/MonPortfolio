name: CI/CD - Production - Angular

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # Un nouveau push annule le CI en cours (résultat obsolète)…
  ci:
    concurrency:
      group: ci-prod-angular
      cancel-in-progress: true
    uses: ./.github/workflows/ci.yml

  # …mais un déploiement commencé n'est JAMAIS annulé (bascule atomique en cours).
  deploy-prod:
    needs: ci
    concurrency:
      group: deploy-prod-angular
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-ssr.yml
    with:
      vps-dir: /var/www/portfolio
      service: angular-portfolio.service
    secrets:
      VPS_IP: ${{ secrets.VPS_IP }}
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSR_PORT: ${{ secrets.APACHE_PROD_SSR_PORT }}
      DOMAIN: ${{ secrets.APACHE_PROD_DOMAIN }}

  apply-apache-config:
    needs: deploy-prod
    uses: ./.github/workflows/deploy-apache.yml
    with:
      sites: "portfolio portfolio-le-ssl"
    secrets: inherit
