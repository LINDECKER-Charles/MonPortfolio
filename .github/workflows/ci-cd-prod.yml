name: CI/CD - Production - Angular

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FRONT_DIR: front-portfolio
  VPS_DIR: /var/www/portfolio
  FRONT_PROCESS: angular-portfolio.service

concurrency:
  group: deploy-prod-angular
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            ${{ env.FRONT_DIR }}
          sparse-checkout-cone-mode: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.FRONT_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONT_DIR }}
        run: npm ci

      - name: Run linter
        working-directory: ${{ env.FRONT_DIR }}
        run: npm run lint --if-present

      # shell: bash => pipefail : l'échec de ng test fait échouer le step malgré le tee
      - name: Run unit tests + coverage
        working-directory: ${{ env.FRONT_DIR }}
        shell: bash
        run: npx ng test --no-watch --code-coverage --browsers=ChromeHeadless 2>&1 | tee karma.log

      - name: Publish test & coverage summary
        if: always()
        working-directory: ${{ env.FRONT_DIR }}
        run: node scripts/test-summary.mjs karma.log >> "$GITHUB_STEP_SUMMARY"

      - name: Build Angular app
        working-directory: ${{ env.FRONT_DIR }}
        run: npm run build

      - name: Upload Angular dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: angular-dist
          path: ${{ env.FRONT_DIR }}/dist
          if-no-files-found: error

  deploy-prod:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Download Angular dist artifact
        uses: actions/download-artifact@v7
        with:
          name: angular-dist
          path: ./dist

      - name: Ensure remote folders exist
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ env.VPS_DIR }}

      - name: Clean remote folder except persistent dirs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            find ${{ env.VPS_DIR }} -mindepth 1 -maxdepth 1 \
              ! -name uploads \
              ! -name logs-app \
              -exec rm -rf {} +

      - name: Copy Angular build to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: ${{ env.VPS_DIR }}

      - name: Restart Angular service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart ${{ env.FRONT_PROCESS }}
            sudo systemctl status ${{ env.FRONT_PROCESS }} --no-pager

  apply-apache-config:
    needs: deploy-prod
    uses: ./.github/workflows/deploy-apache.yml
    with:
      sites: "portfolio portfolio-le-ssl"
    secrets: inherit


