name: Deploy - Apache config

# Workflow réutilisable : appelé par les pipelines test/prod après un déploiement réussi,
# pour réappliquer (idempotent) la config Apache du périmètre concerné. Évite tout drift
# entre le repo et le VPS. Déclenchable aussi manuellement (apply complet par défaut).
on:
  workflow_call:
    inputs:
      sites:
        description: "Vhosts à appliquer (base names, séparés par des espaces)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      sites:
        description: "Vhosts à appliquer (base names, séparés par des espaces)"
        required: false
        default: "portfolio portfolio-le-ssl portfolio-test portfolio-test-le-ssl portfolio-images portfolio-images-le-ssl"
        type: string

permissions:
  contents: read

# Sérialise tous les apply Apache (test + prod) : pas de mutation concurrente de sites-enabled.
concurrency:
  group: deploy-apache
  cancel-in-progress: false

env:
  # Les vhosts sont des fichiers réels dans sites-enabled (pas des symlinks a2ensite).
  APACHE_SITES_DIR: /etc/apache2/sites-enabled
  REMOTE_STAGING: apache-config-staging

jobs:
  deploy-apache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: config
          sparse-checkout-cone-mode: true

      # Chaque site est rendu depuis un template GÉNÉRIQUE (site-ssl,
      # site-http-redirect) paramétré par une table site → variables :
      # les vhosts SSL prod et test ne divergent plus jamais.
      - name: Render vhost templates
        working-directory: config
        env:
          SITES: ${{ inputs.sites }}
          APACHE_PROD_DOMAIN: ${{ secrets.APACHE_PROD_DOMAIN }}
          APACHE_PROD_SSR_PORT: ${{ secrets.APACHE_PROD_SSR_PORT }}
          APACHE_TEST_DOMAIN: ${{ secrets.APACHE_TEST_DOMAIN }}
          APACHE_TEST_SSR_PORT: ${{ secrets.APACHE_TEST_SSR_PORT }}
          APACHE_TEST_REDIRECT_TARGET: ${{ secrets.APACHE_TEST_REDIRECT_TARGET }}
          APACHE_IMAGES_DOMAIN: ${{ secrets.APACHE_IMAGES_DOMAIN }}
          APACHE_IMAGES_DOCROOT: ${{ secrets.APACHE_IMAGES_DOCROOT }}
        run: |
          set -euo pipefail
          command -v envsubst >/dev/null || sudo apt-get install -y gettext-base
          # Allowlist explicite : ne JAMAIS substituer ${APACHE_LOG_DIR} (résolu par Apache).
          ALLOW='$SITE_DOMAIN $SITE_SSR_PORT $SITE_LOG $SITE_EXTRA_HEADERS $APACHE_TEST_DOMAIN $APACHE_TEST_REDIRECT_TARGET $APACHE_IMAGES_DOMAIN $APACHE_IMAGES_DOCROOT'
          NOINDEX='Header always set X-Robots-Tag "noindex, nofollow"'
          mkdir -p staging

          render() { # $1 = base name, $2 = template
            envsubst "$ALLOW" < "$2" > "staging/$1.conf"
            echo "Rendered staging/$1.conf <- $2"
          }

          for base in $SITES; do
            case "$base" in
              portfolio)
                SITE_DOMAIN="$APACHE_PROD_DOMAIN" SITE_LOG=portfolio \
                  render "$base" site-http-redirect.conf.template ;;
              portfolio-le-ssl)
                SITE_DOMAIN="$APACHE_PROD_DOMAIN" SITE_SSR_PORT="$APACHE_PROD_SSR_PORT" \
                SITE_LOG=portfolio SITE_EXTRA_HEADERS='' \
                  render "$base" site-ssl.conf.template ;;
              portfolio-test)
                render "$base" portfolio-test.conf.template ;;
              portfolio-test-le-ssl)
                # X-Robots-Tag : l'environnement de test ne doit pas être indexé.
                SITE_DOMAIN="$APACHE_TEST_DOMAIN" SITE_SSR_PORT="$APACHE_TEST_SSR_PORT" \
                SITE_LOG=portfolio-test SITE_EXTRA_HEADERS="$NOINDEX" \
                  render "$base" site-ssl.conf.template ;;
              portfolio-images|portfolio-images-le-ssl)
                render "$base" "$base.conf.template" ;;
              *)
                echo "Site inconnu : $base" >&2; exit 1 ;;
            esac
          done

          # Page de maintenance (ErrorDocument 502/503 des vhosts SSL).
          cp maintenance.html staging/maintenance.html

      - name: Copy rendered configs to VPS (staging dir)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "config/staging/*"
          target: ${{ env.REMOTE_STAGING }}
          strip_components: 2
          rm: true

      - name: Apply config with configtest guard
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APACHE_SITES_DIR,REMOTE_STAGING
          script: |
            set -euo pipefail
            STAGING="$HOME/$REMOTE_STAGING"
            TS="$(date +%Y%m%d-%H%M%S)"
            BACKUP="/tmp/apache-sites-backup-$TS"

            echo "==> Backup $APACHE_SITES_DIR -> $BACKUP"
            sudo cp -a "$APACHE_SITES_DIR" "$BACKUP"

            echo "==> Deploy maintenance page"
            if [ -f "$STAGING/maintenance.html" ]; then
              sudo cp "$STAGING/maintenance.html" /var/www/maintenance.html
              rm -f "$STAGING/maintenance.html"
            fi

            echo "==> Deploy rendered vhosts"
            for f in "$STAGING"/*.conf; do
              sudo cp "$f" "$APACHE_SITES_DIR/$(basename "$f")"
            done

            echo "==> apache2ctl configtest"
            if ! sudo apache2ctl configtest; then
              echo "!! configtest FAILED — rollback"
              sudo cp -a "$BACKUP"/. "$APACHE_SITES_DIR"/
              sudo apache2ctl configtest
              rm -rf "$STAGING"
              exit 1
            fi

            echo "==> Graceful reload"
            sudo systemctl reload apache2
            sudo systemctl is-active apache2
            rm -rf "$STAGING"
            echo "==> Done (backup kept at $BACKUP)"
