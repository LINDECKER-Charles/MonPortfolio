version: 2
updates:
  - package-ecosystem: npm
    directory: /front-portfolio
    schedule:
      interval: weekly
      day: monday
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-eslint/*"
          - "angular-eslint"
          - "typescript-eslint"
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - "@angular/*"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
