<section class="home-resume">
  <app-home-resume-banner
    [leftIcons]="bannerIconsLeft()"
    [rightIcons]="bannerIconsRight()"
    [label]="bannerLabel()"
  >
  </app-home-resume-banner>

  <app-home-resume-header
    [luciditySources]="luciditySources"
    [lucidityFallback]="lucidityFallback"
    [levelSources]="levelSources"
    [levelFallback]="levelFallback"
  >
  </app-home-resume-header>

  <app-home-resume-content [photoSlides]="photoSlides()"></app-home-resume-content>
</section>
