<div class="about__media" #portraitBlock>
  <div class="portrait-card" appTilt [tiltMax]="3" [tiltPerspective]="1100">
    <div class="portrait-card__frame">
      <div class="portrait-card__inner">
        <app-photo-carousel
          [slides]="slides"
          [bare]="true"
          sizes="(max-width: 640px) 80vw, (max-width: 980px) 400px, 310px">
        </app-photo-carousel>
      </div>
    </div>

    <div class="portrait-card__plate">
      <span>{{ ts.translate('common.photo.developer') }}</span>
      <span class="portrait-card__divider"></span>
      <span>{{ ts.translate('common.photo.trainer') }}</span>
    </div>
  </div>
</div>
