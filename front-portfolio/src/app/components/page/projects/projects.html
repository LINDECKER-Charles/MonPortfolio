<main class="projects-page">
  <app-projects-header />

  <div class="projects-view" role="tablist" [attr.aria-label]="ts.translate('projects.view.aria')">
    <button
      type="button"
      role="tab"
      class="projects-view__tab transition-ritual"
      [class.projects-view__tab--active]="view === 'map'"
      [attr.aria-selected]="view === 'map'"
      (click)="setView('map')">
      {{ ts.translate('projects.view.map') }}
    </button>
    <button
      type="button"
      role="tab"
      class="projects-view__tab transition-ritual"
      [class.projects-view__tab--active]="view === 'list'"
      [attr.aria-selected]="view === 'list'"
      (click)="setView('list')">
      {{ ts.translate('projects.view.list') }}
    </button>
  </div>

  @if (view === 'map') {
    <app-projects-constellation
      [projects]="projects"
      (projectOpened)="openProject($event)" />
  } @else {
    <app-projects-filter
      [filters]="filters"
      [filtersState]="filtersState"
      [availableTags]="availableTags"
      [availableStack]="availableStack"
      (categorySelected)="selectCategory($event)"
      (tagToggled)="toggleTag($event)"
      (stackToggled)="toggleStack($event)"
      (reset)="clearFilters()" />

    <app-projects-timeline
      [projects]="filteredProjects"
      (projectSelected)="openProject($event)" />
  }

  @if (selectedProject; as project) {
    <app-projects-modal
      [project]="project"
      [currentImageIndex]="currentImageIndex"
      (close)="closeProject()"
      (nextImage)="nextImage()"
      (previousImage)="previousImage()" />
  }
</main>
