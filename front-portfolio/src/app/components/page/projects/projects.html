<main class="projects-page">
  <app-projects-header />

  <div class="projects-view" role="tablist" [attr.aria-label]="ts.translate('projects.view.aria')">
    <button
      type="button"
      role="tab"
      class="projects-view__tab transition-ritual"
      [class.projects-view__tab--active]="view === 'map'"
      [attr.aria-selected]="view === 'map'"
      (click)="setView('map')">
      {{ ts.translate('projects.view.map') }}
    </button>
    <button
      type="button"
      role="tab"
      class="projects-view__tab transition-ritual"
      [class.projects-view__tab--active]="view === 'list'"
      [attr.aria-selected]="view === 'list'"
      (click)="setView('list')">
      {{ ts.translate('projects.view.list') }}
    </button>
  </div>

  @if (view === 'map') {
    <app-constellation
      [items]="constellationItems()"
      [categories]="constellationCategories()"
      [labels]="constellationLabels()"
      (itemOpened)="onConstellationOpen($event)" />
  } @else {
    <app-projects-filter
      [filters]="filters"
      [filtersState]="filtersState"
      [availableTags]="availableTags"
      [availableStack]="availableStack"
      (categorySelected)="selectCategory($event)"
      (tagToggled)="toggleTag($event)"
      (stackToggled)="toggleStack($event)"
      (reset)="clearFilters()" />

    @if (filteredProjects.length > 0) {
      <app-projects-timeline
        [projects]="filteredProjects"
        (projectSelected)="openProject($event)" />
    } @else {
      <div class="projects-empty surface-crypt" role="status">
        <p class="projects-empty__title text-engraved">{{ ts.translate('projects.empty.title') }}</p>
        <p class="projects-empty__text text-tome">{{ ts.translate('projects.empty.text') }}</p>
        <button type="button" class="chip chip--gilded transition-ritual" (click)="clearFilters()">
          {{ ts.translate('projects.filter.reset') }}
        </button>
      </div>
    }
  }

  @if (selectedProject; as project) {
    <app-projects-modal
      [project]="project"
      [currentImageIndex]="currentImageIndex"
      (close)="closeProject()"
      (nextImage)="nextImage()"
      (previousImage)="previousImage()" />
  }
</main>
